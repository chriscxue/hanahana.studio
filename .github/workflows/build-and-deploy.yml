# 构建并部署到 GitHub Pages
#
# 为什么需要这个 workflow：
# 教学笔记是定时发布的（每篇 front matter 里写了 date，_config.yml 设了 future: false，
# 未到日期的文章不会被构建出来）。GitHub Pages 默认只在 push 时构建，不 push 就永远
# 停在旧版本，到了日期新文章也不会出现。所以这里加一个每日定时触发，让站点自己重建。
#
# 切到 workflow 构建后，Jekyll 插件不再受 GitHub Pages 白名单限制。

name: Build and deploy

on:
  push:
    branches: [master]
  # 每天 00:30 UTC（北京时间 08:30）重建一次，把当天到期的文章放出来
  schedule:
    - cron: "30 0 * * *"
  # 需要时可以手动触发一次
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 定时构建和 push 构建撞在一起时，让后者排队而不是互相取消
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
