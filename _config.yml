title: HANAHANA STUDIO
tagline: 视觉艺术院校升学策略工作室 · 美国VIA高中官方艺术部
description: HANAHANA STUDIO成立于2013年。13年，94名学生，672+枚Offer。2016年起为美国VIA高中官方艺术部。创始人曾任职全美前十艺术院校招生办公室，深谙美国艺术招生的评审逻辑。
url: "https://hanahana.studio"
lang: zh-CN

# jekyll-seo-tag 只认 page.image，站点级 image 键无效，用 defaults 给每页注入
defaults:
  - scope:
      path: ""
    values:
      image: /images/member/team-photo-og.jpg
  # 百度验证文件不进sitemap（文件本身必须保留，百度会定期回访验证）
  - scope:
      path: "baidu_verify_codeva-lauZPimBDT.html"
    values:
      sitemap: false
  # Channel 文章默认不进sitemap（占位稿/未完成稿不该被收录）。
  # 内容写好、标题定稿后，在那篇 md 的 front matter 里写 sitemap: true 才会进sitemap被收录。
  - scope:
      type: channel
    values:
      sitemap: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  channel:
    output: true
    permalink: /channel/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor

# 站点时区。不写的话构建服务器用 UTC，而 GitHub Pages 的 UTC 会比北京时间慢 8 小时，
# 当天日期的文章会被判成"未来"而跳过不生成（踩过一次，线上 10 篇全 404）。
timezone: Asia/Shanghai

# 不按日期过滤文章。发不发布由"文件在不在 _channel/ 里"决定
# （未发布的放在 艺术教学笔记/待发布/），date 只用于结构化数据里的发布时间，
# 不参与是否生成页面的判断，避免再出现时区边界导致页面消失。
future: true
