    <footer class="footer">
        <a href="{{ '/Consulting.html' | relative_url }}" class="footer-logo">
            <!-- ink overlap r2c5 渐变版，黑底白墨；形状动画由 header.html 定义的 window.hhInitInkLogo 驱动 -->
            <svg width="100%" height="100%" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="hhInkGradF">
                        <stop offset="0%"  stop-color="#777" stop-opacity="0.05"/>
                        <stop offset="45%" stop-color="#777" stop-opacity="0.25"/>
                        <stop offset="80%" stop-color="#777" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#777" stop-opacity="1"/>
                    </radialGradient>
                    <filter id="hhInkEdgeF" x="-15%" y="-15%" width="130%" height="130%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="9" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
                    </filter>
                    <filter id="hhInkBleedF" x="-20%" y="-20%" width="140%" height="140%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
                        <feGaussianBlur in="displaced" stdDeviation="1.6"/>
                    </filter>
                </defs>
                <g id="hh-ink-bleed-f" filter="url(#hhInkBleedF)"></g>
                <g id="hh-ink-body-f" filter="url(#hhInkEdgeF)"></g>
            </svg>
        </a>
        <div class="footer-info">
            <p class="footer-name">HANAHANA STUDIO</p>
            <p>USA</p>
            <p>257 Toll House Road, Maurertown VA 22644</p>
            <p>chris.c.xue@gmail.com</p>
            <p>微信: keokkeokchris</p>
            <p class="footer-copyright">©2026 HANAHANA STUDIO – ALL RIGHTS RESERVED</p>
        </div>
    </footer>

    <script>
        (function () {
            var bleedGroup = document.getElementById('hh-ink-bleed-f');
            var bodyGroup = document.getElementById('hh-ink-body-f');
            if (bleedGroup && bodyGroup && window.hhInitInkLogo) {
                // footer logo 桌面/移动端都静止（forceStatic），全页只留header一个动的logo
                window.hhInitInkLogo(bleedGroup, bodyGroup, 'hhInkGradF', true);
            }
        })();
    </script>
