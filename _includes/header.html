    <header class="header">

                  <!-- ink overlap r2c5 渐变版（logo/ink_overlap_cell_r2c5_gradient.html），画布300×300无隐藏留白 -->
                  <svg width="100%" height="100%" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">

                        <stop offset="45%" stop-color="#111" stop-opacity="0.25"/>
                        <stop offset="80%" stop-color="#111" stop-opacity="1"/>
                        <stop offset="100%" stop-color="#111" stop-opacity="1"/>
                      </radialGradient>

                        <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="9" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
                      </filter>
                      <filter id="hhInkBleed" x="-20%" y="-20%" width="140%" height="140%">
                        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
                        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
                        <feGaussianBlur in="displaced" stdDeviation="1.6"/>
                      </filter>
                    </defs>
                    <g id="hh-ink-bleed" filter="url(#hhInkBleed)"></g>
                    <g id="hh-ink-body" filter="url(#hhInkEdge)"></g>

    <script>
        (function () {
            var toggle = document.getElementById('mobile-nav-toggle');
            var nav = document.getElementById('header-nav');
            toggle.addEventListener('click', function () {
                var isOpen = nav.classList.toggle('open');
                toggle.classList.toggle('open', isOpen);
                toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            });
        })();

        /* ink overlap r2c5 渐变版动画，与 logo/ink_overlap_cell_r2c5_gradient.html 同一套参数。
           挂在 window 上供 footer 复用（同一形状，只换填充渐变的颜色）。
           forceStatic=true 时只渲染第一帧不进动画循环（footer 用；手机端全页只留 header 一个动的logo控发热） */
        window.hhInitInkLogo = function (bleedGroup, bodyGroup, gradId, forceStatic) {
            var cx = 150, cy = 150, r = 100;

            function mulberry32(seed) {
                return function () {
                    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
                    var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                };
            }

            function makeLayerParams(seed) {
                var rng = mulberry32(seed);
                return {
                    h1: 0.10 + rng() * 0.08, p1: rng() * Math.PI * 2,
                    h2: 0.06 + rng() * 0.06, p2: rng() * Math.PI * 2,
                    h3: 0.04 + rng() * 0.04, p3: rng() * Math.PI * 2,
                    h4: 0.03 + rng() * 0.03, p4: rng() * Math.PI * 2,
                    breatheSeed: rng() * Math.PI * 2,
                    driftSeed: rng() * Math.PI * 2
                };
            }

            function wobblePath(cx, cy, r, P, t) {
                var breathe = 1 + 0.008 * Math.sin(t * 0.0004 + P.breatheSeed);
                var driftMag = 1.2 * (r / 180);
                var driftX = driftMag * Math.sin(t * 0.00025 + P.driftSeed);
                var driftY = driftMag * Math.cos(t * 0.0003 + P.driftSeed * 1.7);
                var rotation = 0.02 * Math.sin(t * 0.0002 + P.breatheSeed * 0.7);

                var steps = 24;
                var pts = [];
                for (var i = 0; i < steps; i++) {
                    var a = (i / steps) * Math.PI * 2 + rotation;
                    var w = 1
                        + P.h1 * Math.sin(a * 2 + P.p1 + t * 0.00012)
                        + P.h2 * Math.sin(a * 3 + P.p2 + t * 0.00009)
                        + P.h3 * Math.sin(a * 5 + P.p3 + t * 0.00007)
                        + P.h4 * Math.sin(a * 7 + P.p4 + t * 0.00005);
                    var rr = r * breathe * w;
                    pts.push([cx + driftX + Math.cos(a) * rr, cy + driftY + Math.sin(a) * rr]);
                }

                var d = 'M' + pts[0][0].toFixed(2) + ',' + pts[0][1].toFixed(2);
                for (var j = 0; j < steps; j++) {
                    var curr = pts[j];
                    var next = pts[(j + 1) % steps];
                    var mid = [(curr[0] + next[0]) / 2, (curr[1] + next[1]) / 2];
                    d += 'Q' + curr[0].toFixed(2) + ',' + curr[1].toFixed(2) + ' ' + mid[0].toFixed(2) + ',' + mid[1].toFixed(2);
                }
                return d + 'Z';
            }

            var cellSeed = 1 * 5 + 4; // 9，5×5宫格第二行第五列
            var layers = [];
            var NS = 'http://www.w3.org/2000/svg';

            for (var i = 0; i < 25; i++) {
                var seed = cellSeed * 10000 + i * 9973 + 4211;
                var path = document.createElementNS(NS, 'path');
                path.setAttribute('fill', 'url(#' + gradId + ')');
                var isBleed = i < 8;
                path.setAttribute('opacity', isBleed ? '0.06' : '0.1');
                (isBleed ? bleedGroup : bodyGroup).appendChild(path);
                layers.push({ el: path, params: makeLayerParams(seed), r: isBleed ? r * 1.06 : r });
            }

            function render(t) {
                for (var k = 0; k < layers.length; k++) {
                    layers[k].el.setAttribute('d', wobblePath(cx, cy, layers[k].r, layers[k].params, t));
                }
            }

            var staticFrame = forceStatic
                           || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (staticFrame) {
                render(0);
            } else {
                // 限帧12fps：摆动周期是分钟级的，满帧率跑纯属浪费（SVG滤镜每帧全量重算，
                // 高刷屏上GPU占用打满导致风扇转）；12fps下每帧位移量仍远小于1px，肉眼无差别
                var FRAME_INTERVAL = 1000 / 12;
                var lastRender = -Infinity;
                var running = false;
                function step(now) {
                    if (!running) return;
                    if (now - lastRender >= FRAME_INTERVAL) {
                        lastRender = now;
                        render(now);
                    }
                    requestAnimationFrame(step);
                }
                // logo滚出视口就停掉循环（页面正文阅读时负载归零），滚回来再续跑
                render(0);
                var host = bodyGroup.ownerSVGElement;
                if (host && 'IntersectionObserver' in window) {
                    new IntersectionObserver(function (entries) {
                        var visible = entries[0].isIntersecting;
                        if (visible && !running) {
                            running = true;
                            requestAnimationFrame(step);
                        } else if (!visible) {
                            running = false;
                        }
                    }).observe(host);
                } else {
                    running = true;
                    requestAnimationFrame(step);
                }
            }
        };

        /* 移动端横线等距：量出header-left实际高度精确均分周期，首尾线贴边、所有可见间隙相等
           （对齐桌面端的视觉标准；桌面端是纯CSS固定4px，正好整除，此JS不碰桌面端） */
        (function () {
            var el = document.querySelector('.header-left');
            if (!el) return;
            var mq = window.matchMedia('(max-width: 768px)');
            function apply() {
                if (!mq.matches) {
                    el.style.backgroundImage = '';
                    el.style.backgroundSize = '';
                    el.style.backgroundRepeat = '';
                    return;
                }
                var H = el.offsetHeight;
                if (H < 8) return;
                // n条间隙+首尾贴边的线：周期t=(H-1)/n，行距基准4px
                var n = Math.max(1, Math.round((H - 1) / 4));
                var t = (H - 1) / n;
                // 移动端线色#ddd，比桌面#ccc浅一档（Chris要求移动端更淡）
                el.style.backgroundImage = 'repeating-linear-gradient(to bottom, #ddd 0, #ddd 1px, transparent 1px, transparent ' + t + 'px)';
                el.style.backgroundSize = 'auto';
                el.style.backgroundRepeat = 'repeat';
            }
            apply();
            window.addEventListener('resize', apply);
        })();

        (function () {
            var bleedGroup = document.getElementById('hh-ink-bleed');
            var bodyGroup = document.getElementById('hh-ink-body');
            if (!bleedGroup || !bodyGroup) return;
            // logo被CSS隐藏时不启动动画，避免每帧空算25层路径
            var logoEl = bleedGroup.closest('.logo');
            if (logoEl && window.getComputedStyle(logoEl).display === 'none') return;
            // header logo 桌面/移动端都动（白屏根因是布局循环已修，见shared.css注释；移动端发热靠footer静止减半负载）
            window.hhInitInkLogo(bleedGroup, bodyGroup, 'hhInkGrad', false);
        })();
    </script>
