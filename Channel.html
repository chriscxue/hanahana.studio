---
nav: channel
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>CHANNEL — HANAHANA STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Main */
        .content-hero { width: 100%; border-bottom: 0.5px solid #000; overflow: hidden; }
        .content-hero img { width: 100%; height: 100%; max-height: 480px; object-fit: cover; display: block; }

        .channel-nav {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 0.5px solid #000;
        }
        .channel-nav-item {
            padding: 32px 40px;
            font-size: 20px;
            font-weight: 400;
            text-align: center;
            border-right: 0.5px solid #000;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .channel-nav-item:last-child { border-right: none; }
        .channel-nav-item:hover,
        .channel-nav-item.active { background-color: #F16527; color: #fff; }

        .channel-category { display: none; }
        .channel-category.active { display: flex; flex-direction: column; flex: 1; }

        .channel-layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 3fr;
            border-bottom: 0.5px solid #000;
        }

        .channel-sidebar {
            border-right: 0.5px solid #000;
            display: flex;
            flex-direction: column;
        }

        .channel-sidebar-item {
            padding: 12px 40px;
            border-bottom: 0.5px solid #000;
            cursor: pointer;
            font-size: 16px;
            font-weight: 300;
            color: #000;
            transition: background-color 0.3s ease, color 0.3s ease;
            user-select: none;
        }

        .channel-sidebar-item:last-child { border-bottom: none; }
        .channel-sidebar-item:hover,
        .channel-sidebar-item.active { background-color: #F16527; color: #fff; }

        .channel-content { padding: 64px; }
        .channel-panel { display: none; font-size: 16px; font-weight: 300; color: #888; }
        .channel-panel.active { display: block; }

        .channel-single { flex: 1; padding: 64px; border-bottom: 0.5px solid #000; font-size: 16px; font-weight: 300; color: #888; }

        @media (max-width: 768px) {
            .content-hero img { max-height: 240px; }
            .channel-nav { grid-template-columns: repeat(2, 1fr); }
            .channel-nav-item { padding: 20px; font-size: 16px; }
            .channel-layout { grid-template-columns: 1fr; }
            .channel-sidebar { border-right: none; border-bottom: 0.5px solid #000; }
            .channel-content { padding: 32px 20px; }
        }
    </style>
</head>
<body>
    {% include header.html %}

    <div class="content-hero">
        <img src="images/channel/content-studio.png" alt="HANAHANA content studio">
    </div>

    <div class="channel-nav">
        <div class="channel-nav-item active" onclick="showCategory('cat-speaking')">英语口语2000小时</div>
        <div class="channel-nav-item" onclick="showCategory('cat-papers')">Papers</div>
        <div class="channel-nav-item" onclick="showCategory('cat-youtube')">YouTube</div>
        <div class="channel-nav-item" onclick="showCategory('cat-podcast')">Podcast</div>
    </div>

    <div id="cat-speaking" class="channel-category active">
        <div class="channel-layout">
            <aside class="channel-sidebar">
                <div class="channel-sidebar-item active" onclick="showContent('speaking-1')">01</div>
                <div class="channel-sidebar-item" onclick="showContent('speaking-2')">02</div>
                <div class="channel-sidebar-item" onclick="showContent('speaking-3')">03</div>
                <div class="channel-sidebar-item" onclick="showContent('speaking-4')">04</div>
                <div class="channel-sidebar-item" onclick="showContent('speaking-5')">05</div>
                <div class="channel-sidebar-item" onclick="showContent('speaking-6')">06</div>
            </aside>
            <div class="channel-content">
                <div id="speaking-1" class="channel-panel active">内容待填</div>
                <div id="speaking-2" class="channel-panel">内容待填</div>
                <div id="speaking-3" class="channel-panel">内容待填</div>
                <div id="speaking-4" class="channel-panel">内容待填</div>
                <div id="speaking-5" class="channel-panel">内容待填</div>
                <div id="speaking-6" class="channel-panel">内容待填</div>
            </div>
        </div>
    </div>

    <div id="cat-papers" class="channel-category">
        <div class="channel-layout">
            <aside class="channel-sidebar">
                <div class="channel-sidebar-item active" onclick="showContent('papers-1')">01</div>
                <div class="channel-sidebar-item" onclick="showContent('papers-2')">02</div>
                <div class="channel-sidebar-item" onclick="showContent('papers-3')">03</div>
                <div class="channel-sidebar-item" onclick="showContent('papers-4')">04</div>
                <div class="channel-sidebar-item" onclick="showContent('papers-5')">05</div>
                <div class="channel-sidebar-item" onclick="showContent('papers-6')">06</div>
            </aside>
            <div class="channel-content">
                <div id="papers-1" class="channel-panel active">内容待填</div>
                <div id="papers-2" class="channel-panel">内容待填</div>
                <div id="papers-3" class="channel-panel">内容待填</div>
                <div id="papers-4" class="channel-panel">内容待填</div>
                <div id="papers-5" class="channel-panel">内容待填</div>
                <div id="papers-6" class="channel-panel">内容待填</div>
            </div>
        </div>
    </div>

    <div id="cat-youtube" class="channel-category">
        <div class="channel-single">内容待填（计划做成瀑布流布局）</div>
    </div>

    <div id="cat-podcast" class="channel-category">
        <div class="channel-single">内容待填（计划做成瀑布流布局）</div>
    </div>

    {% include footer.html %}

    <script>
        function showCategory(id) {
            document.querySelectorAll('.channel-nav-item').forEach(item => item.classList.remove('active'));
            document.querySelectorAll('.channel-category').forEach(cat => cat.classList.remove('active'));
            event.currentTarget.classList.add('active');
            document.getElementById(id).classList.add('active');
        }

        function showContent(id) {
            var panel = document.getElementById(id);
            var scope = panel.closest('.channel-category');
            scope.querySelectorAll('.channel-sidebar-item').forEach(item => item.classList.remove('active'));
            scope.querySelectorAll('.channel-panel').forEach(p => p.classList.remove('active'));
            event.currentTarget.classList.add('active');
            panel.classList.add('active');
        }
    </script>
</body>
</html>
