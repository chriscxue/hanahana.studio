<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scrollbar-gutter: stable; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
        }

        /* Header */
        .header {
            width: 100%;
            border-bottom: 0.5px solid #000;
        }

        .header-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
        }

        /* 左侧 - Logo */
        .header-left {
            display: flex;
            align-items: center;
            padding: 40px 40px 40px 150px;
            border-right: 0.5px solid #000;
            background: #000;
        }

        .logo {
            display: block;
            width: 200px;
            height: 200px;
            color: #000;
            text-decoration: none;
        }

        /* 右侧 - 导航菜单 */
        .header-right {
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            border-bottom: 0.5px solid #000;
            text-decoration: none;
            color: #000;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-item:last-child {
            border-bottom: none;
        }

        .nav-item:hover {
            background-color: #F16527;
            color: #fff;
        }

        .nav-label {
            font-size: 16px;
            font-weight: 200;
            line-height: 1.8;
        }

        .nav-arrow svg {
            width: 12px;
            height: 12px;
            transition: transform 0.3s ease;
        }

        .nav-item:hover .nav-arrow svg {
            transform: translateX(4px);
        }

        /* Responsive - 768px */
        @media (max-width: 768px) {
            .header-grid {
                grid-template-columns: 1fr;
            }

            .header-left {
                border-right: none;
                border-bottom: 0.5px solid #000;
                padding: 24px 20px;
            }

            .nav-item {
                padding: 12px 20px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-grid">
            <div class="header-left">
                <a href="Consulting.html" class="logo">
                  <svg width="100%" height="100%" viewBox="0 0 96 24" preserveAspectRatio="xMidYMid meet" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="wg1" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                      <radialGradient id="wg2" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                      <radialGradient id="wg3" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="12" cy="12" r="22" fill="url(#wg1)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="48" cy="12" r="22" fill="url(#wg2)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="84" cy="12" r="22" fill="url(#wg3)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="12" cy="12" r="12" fill="#000"/>
                    <circle cx="48" cy="12" r="12" fill="#000"/>
                    <circle cx="84" cy="12" r="12" fill="#000"/>
                  </svg>
                </a>
            </div>
            <nav class="header-right">
                <a href="Consulting.html" class="nav-item">
                    <span class="nav-label">CONSULTING</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Art High School.html" class="nav-item">
                    <span class="nav-label">ART HIGH SCHOOL</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Archive.html" class="nav-item">
                    <span class="nav-label">ARCHIVE</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Member.html" class="nav-item">
                    <span class="nav-label">MEMBER</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Channel.html" class="nav-item">
                    <span class="nav-label">CHANNEL</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="About.html" class="nav-item">
                    <span class="nav-label">ABOUT</span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 4V20M18 6L6 18M20 12H4M18 18L6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
            </nav>
        </div>
    </header>
</body>
</html>
