<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scrollbar-gutter: stable; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
        }

        /* Header */
        .header {
            width: 100%;
            border-bottom: 0.5px solid #000;
        }

        .header-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
        }

        /* 左侧 - Logo */
        .header-left {
            display: flex;
            align-items: center;
            padding: 40px 40px 40px 150px;
            border-right: 0.5px solid #000;
            background: #000;
        }

        .logo {
            display: block;
            width: 288px;
            height: 72px;
            color: #000;
            text-decoration: none;
        }

        /* 右侧 - 导航菜单 */
        .header-right {
            display: flex;
            flex-direction: column;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            border-bottom: 0.5px solid #000;
            text-decoration: none;
            color: #000;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .nav-item:last-child {
            border-bottom: none;
        }

        .nav-item:hover {
            background-color: #F16527;
            color: #fff;
        }

        .nav-label {
            font-size: 16px;
            font-weight: 200;
            line-height: 1.8;
            display: grid;
        }

        .nav-en,
        .nav-cn {
            grid-area: 1 / 1;
            transition: opacity 0.3s ease;
        }

        .nav-cn { opacity: 0; }

        .nav-item:hover .nav-en { opacity: 0; }
        .nav-item:hover .nav-cn { opacity: 1; }

        .nav-arrow svg {
            width: 16px;
            height: 16px;
            transition: transform 0.3s ease;
        }

        .nav-item:hover .nav-arrow svg {
            transform: translateX(4px);
        }

        .nav-item.current .nav-arrow svg {
            transform: rotate(90deg);
        }

        .nav-item.current:hover .nav-arrow svg {
            transform: rotate(90deg) translateX(4px);
        }

        /* Responsive - 768px */
        @media (max-width: 768px) {
            .header-grid {
                grid-template-columns: 1fr;
            }

            .header-left {
                border-right: none;
                border-bottom: 0.5px solid #000;
                padding: 24px 20px;
                justify-content: center;
            }

            .nav-item {
                padding: 12px 20px;
            }

            .logo { width: 100%; height: auto; }
        }

        @media (max-width: 480px) {
            .logo { width: 60%; height: auto; margin: 0 auto; }
            .header-left { padding: 48px 16px; }
            .header-right { padding: 0; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-grid">
            <div class="header-left">
                <a href="Consulting.html" class="logo">
                  <svg width="100%" height="100%" viewBox="0 0 288 72" preserveAspectRatio="xMidYMid meet" overflow="visible" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                      <radialGradient id="wg1" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                      <radialGradient id="wg2" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                      <radialGradient id="wg3" cx="50%" cy="50%" r="50%">
                        <stop offset="0%"   stop-color="#fff" stop-opacity="0.9"/>
                        <stop offset="40%"  stop-color="#fff" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
                      </radialGradient>
                    </defs>
                    <circle cx="36" cy="36" r="66" fill="url(#wg1)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="144" cy="36" r="66" fill="url(#wg2)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="252" cy="36" r="66" fill="url(#wg3)" opacity="0.2">
                      <animate attributeName="opacity" values="0.2;1;0.2" dur="7s" begin="2.4s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
                    </circle>
                    <circle cx="36" cy="36" r="36" fill="#000"/>
                    <circle cx="144" cy="36" r="36" fill="#000"/>
                    <circle cx="252" cy="36" r="36" fill="#000"/>
                  </svg>
                </a>
            </div>
            <nav class="header-right">
                <a href="Consulting.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">CONSULTING</span><span class="nav-cn">艺术升学指导</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Art High School.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">ART HIGH SCHOOL</span><span class="nav-cn">美国艺术高中</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Archive.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">ARCHIVE</span><span class="nav-cn">工作室档案</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Member.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">MEMBER</span><span class="nav-cn">学员信息中心</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="Channel.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">CHANNEL</span><span class="nav-cn">内容频道</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
                <a href="About.html" class="nav-item">
                    <span class="nav-label"><span class="nav-en">ABOUT</span><span class="nav-cn">关于我们</span></span>
                    <span class="nav-arrow"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </a>
            </nav>
        </div>
    </header>
</body>
</html>
