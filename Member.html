---
nav: member
title: MEMBER
description: "HANAHANA STUDIO学员内部教学资料入口，仅限登记学员邮箱访问。"
sitemap: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {% include head-meta.html %}
    <link rel="stylesheet" href="assets/css/shared.css">
    <style>
        /* Main — 叠层舞台：正文垫底，照片幕布盖在同一格上面（grid叠层），
           验证通过后幕布原地渐隐露出正文。幕布带白底，正文比照片高时下方也不会提前透出 */
        .member-stage { display: grid; }
        .member-stage > .main-content,
        .member-stage > .content-hero { grid-area: 1 / 1; }
        .content-hero { position: relative; width: 100%; border-bottom: 0.5px solid #000; background: #fff; transition: opacity 1.8s ease; }
        .content-hero.curtain-fading { opacity: 0; }
        /* 淡完彻底隐藏并放行鼠标事件，正文链接才可点击 */
        .content-hero.curtain-done { visibility: hidden; pointer-events: none; }
        .content-hero img { width: 100%; height: auto; display: block; }
        .main-content { padding: 0; }
        @media (prefers-reduced-motion: reduce) { .content-hero { transition: none; } }

        /* Access Gate — overlaid on top of the hero image */
        .access-gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .access-gate-card { max-width: 480px; width: 100%; text-align: center; background: rgba(255, 255, 255, 0.8); padding: 40px; border: 0.5px solid #000; }
        .access-input-row { display: flex; gap: 12px; margin-bottom: 24px; }
        .access-input-wrap { position: relative; flex: 1; }
        .access-input {
            width: 100%;
            padding: 16px 20px;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 18px;
            text-align: center;
            background: #fff;
            color: #000;
        }
        .access-input::placeholder { color: transparent; }
        .access-input:focus { outline: none; border-color: #F16527; }
        .fake-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.35em;
            font-size: 18px;
            color: rgba(0,0,0,0.35);
            pointer-events: none;
        }
        .fake-placeholder .emoji { color: initial; }
        .access-input:not(:placeholder-shown) + .fake-placeholder { display: none; }
        .access-submit {
            padding: 16px 36px;
            background: #000;
            color: #fff;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.05em;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .access-submit:hover { background: #F16527; border-color: #F16527; }
        .access-error { font-size: 14px; font-weight: 200; color: #c0392b; margin-top: 4px; }
        .access-error a { color: inherit; }

        .member-content { display: none; }

        @media (max-width: 768px) {
            .content-hero img { aspect-ratio: 2 / 3; object-fit: cover; }
            .access-gate { padding: 20px; }
            .access-gate-card { padding: 28px 20px; }
            .access-input-row { flex-direction: column; margin-bottom: 16px; }
            .access-input { padding: 12px 16px; font-size: 16px; }
            .fake-placeholder { font-size: 16px; }
            .access-submit { padding: 12px 24px; }
        }
    </style>
</head>
<body>
    {% include header.html %}

    <div class="member-stage">
        <!-- 正文在前、幕布在后：grid同格叠放时后出现的元素画在上层，不用z-index -->
        <main class="main-content">
            <div class="member-content" id="member-content">
                <!-- 验证通过后显示的内部文件内容，待填 -->
            </div>
        </main>

        <div class="content-hero" id="content-hero">
            <img src="images/member/team-photo.webp" alt="HANAHANA members">
            <div class="access-gate" id="access-gate">
                <div class="access-gate-card">
                    <div class="access-input-row">
                        <div class="access-input-wrap">
                            <input type="email" class="access-input" id="access-email-input" placeholder=" " autocomplete="email">
                            <span class="fake-placeholder"><span>你知道该输入什么</span><span class="emoji">😉</span></span>
                        </div>
                        <button class="access-submit" type="button" id="access-submit-btn">进入</button>
                    </div>
                    <div class="access-error" id="access-error" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    {% include footer.html %}

    <script>
        (function () {
            var API_BASE = location.hostname === 'localhost' ? 'http://localhost:8787' : 'https://api.hanahana.studio';
            var STORAGE_KEY = 'hanahana_member_email';

            var hero = document.getElementById('content-hero');
            var content = document.getElementById('member-content');
            var input = document.getElementById('access-email-input');
            var submitBtn = document.getElementById('access-submit-btn');
            var errorEl = document.getElementById('access-error');

            function showError(msg) {
                errorEl.textContent = msg;
                errorEl.style.display = 'block';
            }
            function clearError() {
                errorEl.style.display = 'none';
                errorEl.textContent = '';
            }
            function unlock() {
                // 正文先就位在幕布后面，整块幕布（照片+验证卡片）原地渐隐；
                // 首次登录和老学员localStorage静默验证走同一条路，每次访问都播这个过场
                content.style.display = 'block';
                hero.classList.add('curtain-fading');
                // 用定时器而非transitionend收尾：prefers-reduced-motion下transition被禁不会触发事件
                setTimeout(function () { hero.classList.add('curtain-done'); }, 1900);
            }

            function checkEmail(email, onResult) {
                fetch(API_BASE + '/member/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                })
                    .then(function (res) { return res.json(); })
                    .then(function (data) { onResult(data.allowed === true, null); })
                    .catch(function (err) { onResult(false, err); });
            }

            function submit() {
                var email = input.value.trim().toLowerCase();
                clearError();
                if (!email) return;
                checkEmail(email, function (allowed, err) {
                    if (err) {
                        showError('网络错误，请重试');
                        return;
                    }
                    if (allowed) {
                        localStorage.setItem(STORAGE_KEY, email);
                        unlock();
                    } else {
                        showError('该邮箱不在学员名单内，如有疑问请联系 chris.c.xue@gmail.com');
                    }
                });
            }

            submitBtn.addEventListener('click', submit);
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') submit();
            });

            var savedEmail = localStorage.getItem(STORAGE_KEY);
            if (savedEmail) {
                checkEmail(savedEmail, function (allowed, err) {
                    if (allowed) {
                        unlock();
                    } else if (!err) {
                        // 只有明确被移出名单才清除；网络错误保留登录邮箱，下次刷新再验
                        localStorage.removeItem(STORAGE_KEY);
                    }
                });
            }
        })();
    </script>
</body>
</html>
