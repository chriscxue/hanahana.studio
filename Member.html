nav: member
---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MEMBER — HANAHANA STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scrollbar-gutter: stable; }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            line-height: 1.6;
            color: #000;
            background-color: #fff;
        }

        /* Header */
        .header { width: 100%; border-bottom: 0.5px solid #000; }
        .header-grid { display: grid; grid-template-columns: 2fr 1fr; }
        .header-left {
            display: flex;
            align-items: center;
            padding: 40px 40px 40px 150px;
            border-right: 0.5px solid #000;
        }
        .logo { display: none; width: 288px; height: 72px; color: #000; text-decoration: none; }
        .header-right { display: flex; flex-direction: column; }
        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 40px;
            border-bottom: 0.5px solid #000;
            text-decoration: none;
            color: #000;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .nav-item:last-child { border-bottom: none; }
        .nav-item:hover { background-color: #F16527; color: #fff; }
        .nav-label { font-size: 16px; font-weight: 200; line-height: 1.8; display: grid; }
        .nav-en, .nav-cn { grid-area: 1 / 1; transition: opacity 0.3s ease; }
        .nav-cn { opacity: 0; }
        .nav-item:hover .nav-en { opacity: 0; }
        .nav-item:hover .nav-cn { opacity: 1; }
        .nav-arrow svg { width: 16px; height: 16px; transition: transform 0.3s ease; }
        .nav-item:hover .nav-arrow svg { transform: translateX(4px); }
        .nav-item.current .nav-arrow svg { transform: rotate(90deg); }
        .nav-item.current:hover .nav-arrow svg { transform: rotate(90deg) translateX(4px); }

        /* Main */
        .content-hero { position: relative; width: 100%; border-bottom: 0.5px solid #000; }
        .content-hero img { width: 100%; height: auto; display: block; }
        .main-content { padding: 0; }
        .section-title { font-size: 96px; font-weight: 800; color: #000; line-height: 1.2; }

        /* Access Gate — overlaid on top of the hero image */
        .access-gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .access-gate-card { max-width: 480px; width: 100%; text-align: center; background: #fff; padding: 40px; border: 0.5px solid #000; }
        .access-input-row { display: flex; gap: 12px; margin-bottom: 24px; }
        .access-input {
            flex: 1;
            padding: 16px 20px;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 18px;
            letter-spacing: 0.15em;
            text-align: center;
            text-transform: uppercase;
            background: #fff;
            color: #000;
        }
        .access-input::placeholder { letter-spacing: normal; text-transform: none; color: rgba(0,0,0,0.35); }
        .access-input:focus { outline: none; border-color: #F16527; }
        .access-submit {
            padding: 16px 36px;
            background: #000;
            color: #fff;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.05em;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .access-submit:hover { background: #F16527; border-color: #F16527; }
        .access-forgot {
            display: inline-block;
            font-size: 14px;
            font-weight: 200;
            color: rgba(0,0,0,0.5);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.3s ease;
        }
        .access-forgot:hover { color: #F16527; }

        .member-content { display: none; }

        /* Footer */
        .footer {
            width: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 80px 40px 40px;
            gap: 60px;
        }
        .footer-logo { display: block; width: 200px; height: 50px; }
        .footer-info { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
        .footer-info p { font-size: 16px; font-weight: 200; line-height: 1.4; color: rgba(255,255,255,0.6); }
        .footer-info .footer-name { font-size: 20px; font-weight: 600; line-height: 1.8; letter-spacing: 0.1em; color: #fff; margin-bottom: 8px; }
        .footer-info .footer-copyright { font-size: 14px; font-weight: 200; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); margin-top: 8px; }

        @media (max-width: 768px) {
            .header-grid { grid-template-columns: 1fr; }
            .header-left { border-right: none; border-bottom: 0.5px solid #000; padding: 24px 20px; justify-content: center; }
            .nav-item { padding: 12px 20px; }
            .logo { width: 100%; height: auto; }
            .section-title { font-size: 40px; }

            .access-gate { padding: 20px; }
            .access-gate-card { padding: 28px 20px; }
            .access-input-row { flex-direction: column; margin-bottom: 16px; }
            .access-input { padding: 12px 16px; font-size: 16px; }
            .access-submit { padding: 12px 24px; }
        }

        @media (max-width: 480px) {
            .logo { width: 60%; height: auto; margin: 0 auto; }
            .header-left { padding: 48px 16px; }
            .header-right { padding: 0; }
        }
    </style>
</head>
<body>
    {% include header.html %}

    <div class="content-hero">
        <img src="images/member/team-photo.png" alt="HANAHANA members">
        <div class="access-gate">
            <div class="access-gate-card">
                <div class="access-input-row">
                    <input type="text" class="access-input" placeholder="请输入你的学员验证码" maxlength="8">
                    <button class="access-submit" type="button">进入</button>
                </div>
                <a href="#" class="access-forgot">忘记验证码？</a>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="member-content">
            <!-- 验证通过后显示的内部文件内容，待填 -->
        </div>
    </main>

    {% include footer.html %}
</body>
</html>
