<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>MEMBER — HANAHANA STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@100;200;300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/shared.css">
    <style>
        /* Main */
        .content-hero { position: relative; width: 100%; border-bottom: 0.5px solid #000; }
        .content-hero img { width: 100%; height: auto; display: block; }
        .main-content { padding: 0; }
        .section-title { font-size: 96px; font-weight: 800; color: #000; line-height: 1.2; }

        /* Access Gate — overlaid on top of the hero image */
        .access-gate { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .access-gate-card { max-width: 480px; width: 100%; text-align: center; background: #fff; padding: 40px; border: 0.5px solid #000; }
        .access-input-row { display: flex; gap: 12px; margin-bottom: 24px; }
        .access-input {
            flex: 1;
            padding: 16px 20px;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 18px;
            letter-spacing: 0.15em;
            text-align: center;
            text-transform: uppercase;
            background: #fff;
            color: #000;
        }
        .access-input::placeholder { letter-spacing: normal; text-transform: none; color: rgba(0,0,0,0.35); }
        .access-input:focus { outline: none; border-color: #F16527; }
        .access-submit {
            padding: 16px 36px;
            background: #000;
            color: #fff;
            border: 0.5px solid #000;
            font-family: inherit;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.05em;
            white-space: nowrap;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .access-submit:hover { background: #F16527; border-color: #F16527; }
        .access-forgot {
            display: inline-block;
            font-size: 14px;
            font-weight: 200;
            color: rgba(0,0,0,0.5);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.3s ease;
        }
        .access-forgot:hover { color: #F16527; }

        .member-content { display: none; }

        @media (max-width: 768px) {
            .section-title { font-size: 40px; }

            .access-gate { padding: 20px; }
            .access-gate-card { padding: 28px 20px; }
            .access-input-row { flex-direction: column; margin-bottom: 16px; }
            .access-input { padding: 12px 16px; font-size: 16px; }
            .access-submit { padding: 12px 24px; }
        }
    </style>
</head>
<body>
    {% include header.html %}

    <div class="content-hero">
        <img src="images/member/team-photo.png" alt="HANAHANA members">
        <div class="access-gate">
            <div class="access-gate-card">
                <div class="access-input-row">
                    <input type="text" class="access-input" placeholder="请输入你的学员验证码" maxlength="8">
                    <button class="access-submit" type="button">进入</button>
                </div>
                <a href="#" class="access-forgot">忘记验证码？</a>
            </div>
        </div>
    </div>

    <main class="main-content">
        <div class="member-content">
            <!-- 验证通过后显示的内部文件内容，待填 -->
        </div>
    </main>

    {% include footer.html %}
</body>
</html>
